name: Build

# 매 푸시마다 빌드해서 결과물을 올리고, v* 태그를 푸시하면 Release 초안을 만든다.
# SignPath 승인 후에는 아래 "Sign" 단계의 주석을 풀어 서명된 설치 파일을 릴리스한다.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Upload build output
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: duru-unsigned
          path: |
            out/Duru-Setup.exe
            out/Duru-Setup.zip
            out/SHA256SUMS.txt

      # - name: Sign
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: '<SignPath organization id>'
      #     project-slug: 'Duru'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME out/Duru-Setup.exe out/Duru-Setup.zip out/Duru.exe out/SHA256SUMS.txt --draft --title "Duru $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
