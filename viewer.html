<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duru</title>
<link rel="icon" type="image/x-icon" sizes="16x16 24x24 32x32 48x48 64x64 256x256" href="app.ico?v=__VERSION__">
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:block;src:url("PretendardVariable.woff2") format("woff2-variations")}
:root{
  --bg:#ffffff;--surface:#f7f7f8;--surface-2:#efeff1;--fg:#1f2329;--fg-2:#4b5260;--muted:#8a909b;
  --border:#e6e7ea;--accent:#2f6fed;--accent-soft:#e9f0fe;--code-fg:#c4314b;--code-bg:#f3f4f6;--pre-bg:#f7f8fa;--warn:#e8890c;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.08);
  --j-key:#0b5cad;--j-str:#1a7f37;--j-num:#b35900;--j-bool:#8250df;
  --fs:17px;--measure:1000px;
  --sans:"Pretendard Variable",Pretendard,"Segoe UI","Malgun Gothic",sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"Pretendard Variable",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191d;--surface:#1e2025;--surface-2:#272a30;--fg:#e4e6ea;--fg-2:#b7bcc5;--muted:#7f8590;
  --border:#2c2f36;--accent:#6ea1ff;--accent-soft:#1f2b42;--code-fg:#ff8fa3;--code-bg:#262930;--pre-bg:#1f2227;--warn:#f0a43a;
  --j-key:#7cb7ff;--j-str:#7ee2a8;--j-num:#ffb86b;--j-bool:#c79bff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#17191d;--surface:#1e2025;--surface-2:#272a30;--fg:#e4e6ea;--fg-2:#b7bcc5;--muted:#7f8590;
  --border:#2c2f36;--accent:#6ea1ff;--accent-soft:#1f2b42;--code-fg:#ff8fa3;--code-bg:#262930;--pre-bg:#1f2227;--warn:#f0a43a;
  --j-key:#7cb7ff;--j-str:#7ee2a8;--j-num:#ffb86b;--j-bool:#c79bff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}

/* ── 사이드바 ── */
#side{width:288px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
body.side-off #side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
.logo{width:30px;height:30px;display:block}
#about{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
#about.show{display:flex}
#about .box{background:var(--bg);color:var(--fg);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
#about .hd{display:flex;align-items:center;gap:14px;padding:22px 24px 14px}
#about .hd img{width:48px;height:48px}
#about .hd b{font-size:19px;display:block}
#about .hd span{font-size:13px;color:var(--muted)}
#about .hd .ib{margin-left:auto;align-self:flex-start}
#about pre{margin:0;padding:16px 24px 24px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;color:var(--fg-2);border-top:1px solid var(--border)}
.brand b{font-size:15px;font-weight:700;flex:1}
.actions{display:flex;gap:6px;padding:4px 12px 4px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn svg{width:15px;height:15px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.sec span{font-weight:600}
#filter{margin:2px 12px 6px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px;outline:none;display:none}
#filter:focus{border-color:var(--accent)}
body.many #filter{display:block}
#docs{padding:2px 8px 8px;overflow-y:auto;max-height:42vh;flex:none}
.doc{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:8px;cursor:pointer}
.doc:hover{background:var(--surface-2)}
.doc.on{background:var(--accent-soft)}
.doc.on .nm{color:var(--accent);font-weight:650}
.doc>svg{width:16px;height:16px;color:var(--muted)}
.doc.on>svg{color:var(--accent)}
.doc .tx{flex:1;min-width:0}
.doc .nm{font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.doc .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.doc .x{opacity:0;border:0;background:none;padding:4px;border-radius:6px;cursor:pointer;color:var(--muted);display:grid}
.doc:hover .x{opacity:1}
.doc .x:hover{background:var(--border);color:var(--fg)}
.doc .x svg{width:14px;height:14px}
.none{padding:10px 20px;font-size:13px;color:var(--muted);line-height:1.6}
.divider{height:1px;background:var(--border);margin:6px 16px 0}
#toc{flex:1;overflow-y:auto;padding:2px 8px 24px;min-height:0}
#toc a{display:block;color:var(--fg-2);text-decoration:none;font-size:13.5px;line-height:1.45;padding:5px 12px;border-radius:7px}
#toc a:hover{background:var(--surface-2);color:var(--fg)}
#toc a.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
#toc a.l1{font-weight:650;color:var(--fg)}
#toc a.l1.on{color:var(--accent)}
#toc a.l3{padding-left:26px;font-size:13px}
#toc a.l4{padding-left:40px;font-size:12.5px;color:var(--muted)}

/* ── 메인 ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg)}
#top .ttl{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
#top .ttl b{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
#status.dirty{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
#status.saved{color:var(--muted)}
#top .tools{display:flex;align-items:center;gap:2px}
.ib{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.txt{width:auto;padding:0 10px;font-size:13px;font-weight:650;display:flex;align-items:center;gap:6px}
.ib.txt svg{width:16px;height:16px}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}
#content{flex:1;display:flex;min-height:0}
#editor{display:none;flex:1;min-width:0;border:0;outline:none;resize:none;padding:40px 44px 160px;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.8;tab-size:2;overflow-wrap:break-word;border-right:1px solid var(--border)}
body.editing #editor{display:block}
#scroll{flex:1;min-width:0;overflow-y:auto}
body.editing #scroll{background:var(--surface)}
body.editing article{padding:40px 44px 160px}

/* ── 본문 타이포그래피 ── */
article{max-width:calc(var(--measure) + 112px);margin:0 auto;padding:48px 56px 160px;font-size:var(--fs);line-height:1.85;letter-spacing:-.003em;overflow-wrap:break-word;color:var(--fg)}
body.wide article{--measure:100%;max-width:none}
article>:first-child{margin-top:0!important}
article h1,article h2,article h3,article h4,article h5,article h6{line-height:1.4;font-weight:700;letter-spacing:-.02em;scroll-margin-top:24px;color:var(--fg)}
article h1{font-size:1.85em;font-weight:800;margin:0 0 .8em;padding-bottom:.45em;border-bottom:1px solid var(--border)}
article h2{font-size:1.45em;margin:2.2em 0 .7em}
article h3{font-size:1.2em;margin:1.9em 0 .6em}
article h4{font-size:1.05em;margin:1.6em 0 .5em}
article h5,article h6{font-size:1em;margin:1.4em 0 .5em;color:var(--fg-2)}
article p{margin:0 0 1.15em}
article a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
article a:hover{border-bottom-color:var(--accent)}
article strong{font-weight:700}
article ul,article ol{margin:0 0 1.15em;padding-left:1.5em}
article li{margin:.35em 0;padding-left:.2em}
article li::marker{color:var(--muted)}
article li>ul,article li>ol{margin:.3em 0 .4em}
article li>p{margin:0 0 .5em}
article li:has(>input[type=checkbox]){list-style:none;margin-left:-1.4em}
article input[type=checkbox]{width:16px;height:16px;margin:0 .5em 0 0;vertical-align:-2px;accent-color:var(--accent)}
article blockquote{margin:0 0 1.2em;padding:.9em 1.2em;background:var(--surface);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;color:var(--fg-2)}
body.editing article blockquote{background:var(--bg)}
article blockquote>:last-child{margin-bottom:0}
article code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);color:var(--code-fg);padding:.15em .42em;border-radius:6px;word-break:break-all}
article pre{position:relative;margin:0 0 1.3em;background:var(--pre-bg);border:1px solid var(--border);border-radius:12px;padding:18px 20px;overflow-x:auto;line-height:1.6}
article pre code{background:none;color:var(--fg);padding:0;font-size:.82em;word-break:normal;white-space:pre}
.copy{position:absolute;top:8px;right:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:7px;font-size:12px;padding:3px 9px;cursor:pointer;opacity:0;transition:opacity .15s}
pre:hover .copy{opacity:1}
.copy:hover{color:var(--fg)}
.tbl{overflow-x:auto;margin:0 0 1.3em;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
article table{border-collapse:collapse;width:100%;font-size:.9em;line-height:1.6}
article th,article td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
article th{background:var(--surface);font-weight:650;white-space:nowrap}
article tr:last-child td{border-bottom:0}
article td+td,article th+th{border-left:1px solid var(--border)}
article img{max-width:100%;border-radius:8px}
article hr{border:0;height:1px;background:var(--border);margin:2.4em 0}

body.hangul article,body.hangul #editor,body.hangul #toc a,body.hangul .plaintxt{word-break:keep-all}
:lang(ko) .card,:lang(ko) .none{word-break:keep-all}
/* 언어별 CJK 글꼴 우선순위 */
:root:lang(ja){--sans:"Pretendard Variable",Pretendard,"Segoe UI","Yu Gothic UI",Meiryo,"Malgun Gothic",sans-serif}
:root:lang(zh){--sans:"Pretendard Variable",Pretendard,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","Malgun Gothic",sans-serif}
#about .lang{display:flex;align-items:center;gap:8px;padding:0 24px 14px;font-size:13px;color:var(--fg-2)}
#about .lang svg{width:16px;height:16px;color:var(--muted)}
#about select{margin-left:auto;font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 8px;outline:none}
#about select:focus{border-color:var(--accent)}

/* ── JSON ── */
body.codedoc #editor{font-family:var(--mono);font-size:14px;line-height:1.65;word-break:break-all}
.yc{color:var(--muted);font-style:italic}.ym{color:var(--j-bool)}
.plaintxt{white-space:pre-wrap;overflow-wrap:break-word;line-height:1.85}
.doc .ext{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;letter-spacing:.02em;flex:none}
.jbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.jbar .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.jbar button{border:0;background:var(--bg);padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg-2)}
.jbar button:hover{color:var(--accent)}
.jbar .seg button.on{background:var(--accent-soft);color:var(--accent)}
.jbar .plain{border:1px solid var(--border);border-radius:8px}
.jbar .info{margin-left:auto;font-size:12.5px;color:var(--muted)}
.jtree,.jraw{font-family:var(--mono);font-size:.8em;line-height:1.75;background:var(--pre-bg);border:1px solid var(--border);border-radius:12px;padding:16px 18px 16px 30px;overflow-x:auto;margin:0}
.jraw{padding-left:20px;white-space:pre}
.jn{padding-left:16px;white-space:pre-wrap;word-break:break-all}
.jtree>.jn{padding-left:0}
.jn>summary{list-style:none;cursor:pointer;border-radius:5px;margin-left:-16px;padding-left:16px;position:relative}
.jtree>.jn>summary{margin-left:-16px}
.jn>summary::-webkit-details-marker{display:none}
.jn>summary::before{content:'▸';position:absolute;left:2px;color:var(--muted);transition:transform .12s}
.jn[open]>summary::before{transform:rotate(90deg)}
.jn>summary:hover{background:var(--surface-2)}
.jn[open]>summary>.jx{display:none}
.jc{color:var(--muted);font-size:.9em;margin-left:8px;font-family:var(--sans)}
.ch{border-left:1px dashed var(--border);margin-left:-11px;padding-left:11px}
.jk{color:var(--j-key)}.ji{color:var(--muted)}.jv-s{color:var(--j-str)}.jv-n{color:var(--j-num)}.jv-b{color:var(--j-bool)}.jv-null{color:var(--muted);font-style:italic}
.jmore{margin:4px 0 4px 16px;border:1px solid var(--border);background:var(--bg);color:var(--accent);border-radius:7px;font-size:12px;padding:3px 10px;cursor:pointer;font-family:var(--sans)}
.jerr{margin:0 0 14px;padding:12px 16px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);font-size:14px;font-weight:600}

/* ── 맨 위로 ── */
#toTop{position:absolute;right:28px;bottom:28px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--fg-2);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:6}
#toTop.show{opacity:1;transform:none;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent)}

/* ── 빈 화면 / 드래그 ── */
#empty{flex:1;display:none;align-items:center;justify-content:center;padding:32px}
body.blank #empty{display:flex}
body.blank #content,body.blank #top .tools,body.blank #status{display:none}
.card{width:min(520px,100%);border:2px dashed var(--border);border-radius:18px;padding:52px 32px;text-align:center}
.card .logo{width:56px;height:56px;border-radius:14px;margin:0 auto 20px;font-size:20px}
.card h2{margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.card .row{display:flex;gap:8px;justify-content:center;margin-top:22px}
.card .btn{flex:none;padding:9px 16px}
kbd{font-family:var(--sans);font-size:12px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--bg)}
.keys{margin-top:22px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#drop{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--accent) 10%,transparent);display:none;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent);z-index:20;pointer-events:none;backdrop-filter:blur(2px)}
body.dragging #drop{display:flex}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:860px){#side{position:fixed;inset:0 auto 0 0;z-index:15;box-shadow:var(--shadow)}article{padding:28px 20px 120px}}
</style>
</head>
<body class="blank">
<aside id="side">
  <div class="brand"><img class="logo" src="icon.png" alt=""><b>Duru</b><button class="ib" id="aboutBtn" data-i18n-title="about_tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button></div>
  <div class="actions">
    <button class="btn primary" id="newBtn" data-i18n-title="new_doc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="new_doc"></span></button>
    <button class="btn" id="openBtn" data-i18n-title="open_tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i18n="open"></span></button>
  </div>
  <div class="sec"><span data-i18n="docs"></span> <span id="count"></span></div>
  <input id="filter" data-i18n-ph="filter">
  <div id="docs"></div>
  <div class="divider"></div>
  <div class="sec" data-i18n="toc"></div>
  <nav id="toc"></nav>
</aside>
<main id="main">
  <header id="top">
    <button class="ib" id="sideBtn" data-i18n-title="side_tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div class="ttl"><b id="ttl"></b><span id="sub"></span></div>
    <span id="status"></span>
    <div class="tools">
      <button class="ib txt" id="editBtn" data-i18n-title="edit_tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span></span></button>
      <button class="ib txt" id="saveBtn" data-i18n-title="save_tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h9V3M7 21v-7h10v7"/></svg><span data-i18n="save"></span></button>
      <div class="sep"></div>
      <button class="ib txt" id="fsDown" data-i18n="fs_down" data-i18n-title="fs_down_tip"></button>
      <button class="ib txt" id="fsUp" data-i18n="fs_up" data-i18n-title="fs_up_tip"></button>
      <button class="ib" id="wideBtn" data-i18n-title="wide_tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></button>
      <div class="sep"></div>
    </div>
    <button class="ib" id="themeBtn" data-i18n-title="theme_tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
  </header>
  <div id="content">
    <textarea id="editor" spellcheck="false" data-i18n-ph="editor_ph"></textarea>
    <div id="scroll"><article id="doc"></article></div>
  </div>
  <button id="toTop" data-i18n-title="to_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

  let p;

    const r = indexedDB.open('mdviewer', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('docs', { keyPath: 'key' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('docs', mode), req = fn(t.objectStore('docs'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }));
  return {
    all: () => Promise.race([tx('readonly', s => s.getAll()), new Promise(r => setTimeout(() => r([]), 1500))]).catch(() => []),
    put: d => tx('readwrite', s => s.put(d)).catch(() => {}),
    del: k => tx('readwrite', s => s.delete(k)).catch(() => {})
  };
})();

const TOKEN = '__TOKEN__';
async function api(name, data) {
  const r = await fetch('/api/' + name, { method: 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(data || {}) });
  if (!r.ok) throw new Error(await r.text() || r.status);
  return r.json();
}

/* ── 인코딩 자동 감지 ── */
function decodeBytes(u8) {
  if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8);
  if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); }
  catch (e) { return new TextDecoder(ANSI).decode(u8); }
}
const ANSI = (() => { try { const n = '__ANSI__'; new TextDecoder(n); return n === 'utf-8' ? 'windows-1252' : n; } catch (e) { return 'windows-1252'; } })();
const b64bytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));

function applyPrefs() {
  document.documentElement.style.setProperty('--fs', prefs.fs + 'px');
  if (prefs.theme) document.documentElement.dataset.theme = prefs.theme; else delete document.documentElement.dataset.theme;
  body.classList.toggle('wide', prefs.wide);
  body.classList.toggle('side-off', !prefs.side);
  $('wideBtn').classList.toggle('on', prefs.wide);
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── 문서 추가/삭제 ── */
function addDoc(d) {
  const old = docs.find(x => x.key === d.key);
  if (old) Object.assign(old, d, { added: old.added }); else docs.push(d);
  persist(old || d);
  active = d.key;
}
function removeDoc(key) {
  const i = docs.findIndex(d => d.key === key); if (i < 0) return;
  if (docs[i].dirty && !confirm(t('confirm_remove'))) return;
  docs.splice(i, 1); DB.del(key); backup(); delete scrollPos[key]; ls.set('scroll', scrollPos);
  if (active === key) { active = docs.length ? docs[Math.min(i, docs.length - 1)].key : null; setEditing(false); }

// 끌어다 놓은 파일: 원래 위치를 찾으면 그 파일로 연결(Ctrl+S 로 바로 저장), 못 찾으면 처음 저장할 때만 위치를 물어봄

/* ── 저장: 경로가 있으면 Ctrl+S 로 바로 저장, 없으면 처음 한 번만 위치 선택 ── */
let saving = false;
async function save(saveAs) {
  const d = cur(); if (!d || saving) return;
  if (isJson(d)) {
    try { JSON.parse(d.text.replace(/^﻿/, '')); }
    catch (e) { if (!confirm(t('json_bad', e.message))) return; }
  }
  saving = true;
  try {
    // 예전에 끌어다 놓아 경로가 없는 기존 파일 → 원래 위치를 찾아 거기에 저장
    if (!d.path && !d.isNew && !saveAs) {
      try {
        const m = await api('locate', { name: d.name });
        if (m.length === 1 && confirm(t('save_orig', m[0].path))) Object.assign(d, { path: m[0].path, dir: dirOf(m[0].path), key: d.key });
      } catch (e) {}
    }
    if (d.path && !saveAs) {
      const r = await api('save', { path: d.path, text: d.text });
      Object.assign(d, { mtime: r.mtime, dirty: false });
      toast(t('saved_toast'));
    } else {
      const r = await api('saveas', { name: d.name, dir: d.dir, text: d.text });
      if (!r) return;
      // 같은 경로의 다른 항목이 있으면 정리
      const dup = docs.find(x => x !== d && x.path && x.path.toLowerCase() === r.path.toLowerCase());
      if (dup) { docs.splice(docs.indexOf(dup), 1); DB.del(dup.key); }
      Object.assign(d, { path: r.path, dir: dirOf(r.path), name: r.name, mtime: r.mtime, dirty: false, isNew: false });
      toast(t('saved_as', r.name));
    }
    persist(d); renderList(); renderHeader(d);
  } catch (e) { toast(t('save_fail', e.message)); }
  finally { saving = false; }
}

/* ── 새로 들어온 파일 받기 + 열린 파일이 밖에서 바뀌면 다시 불러오기 ── */

async function watch() {

  try {
    const m = await api('stat', { path: d.path });
    if (!m || m === d.mtime) return;
    const e = await api('read', { path: d.path });
    if (!e || cur() !== d || d.dirty) return;
    Object.assign(d, { text: decodeBytes(b64bytes(e.b64)), mtime: e.mtime });

/* ── 렌더링 ── */

/* ── JSON 보기 (트리 / 텍스트) ── */
const DOC_EXT = /\.(md|markdown|mdown|txt|json|ya?ml)$/i;

function jSpan(cls, text) { const s = document.createElement('span'); s.className = cls; s.textContent = text; return s; }

  else if (/^(true|false|yes|no|on|off)$/i.test(t)) out = `<span class="jv-b">${esc(val)}</span>`;
  else if (/^(null|~)$/i.test(t)) out = `<span class="jv-null">${esc(val)}</span>`;

  body.classList.toggle('editing', editing);
  $('editBtn').classList.toggle('on', editing);
  $('editBtn').querySelector('span').textContent = editing ? t('view') : t('edit');
  if (editing) { editor.value = cur().text; editor.focus(); }
}
let typeT;
editor.addEventListener('input', () => {
  const d = cur(); if (!d) return;
  d.text = editor.value;
  if (!d.dirty) { d.dirty = true; renderList(); }
  renderHeader(d);
  clearTimeout(typeT);
  typeT = setTimeout(() => { renderBody(d); persist(d); }, 150);
});
editor.addEventListener('scroll', () => {   // 미리보기를 비율로 따라가게
  const r = editor.scrollTop / Math.max(1, editor.scrollHeight - editor.clientHeight);
  scroller.scrollTop = r * (scroller.scrollHeight - scroller.clientHeight);
});
function wrapSel(mark) {
  const s = editor.selectionStart, e = editor.selectionEnd, v = editor.value;
  editor.setRangeText(mark + v.slice(s, e) + mark, s, e, 'select');
  editor.setSelectionRange(s + mark.length, e + mark.length);
  editor.dispatchEvent(new Event('input'));
}
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); editor.setRangeText('  ', editor.selectionStart, editor.selectionEnd, 'end'); editor.dispatchEvent(new Event('input')); }
  if (e.ctrlKey && !e.shiftKey && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); wrapSel('**'); }
  if (e.ctrlKey && !e.shiftKey && (e.key === 'i' || e.key === 'I')) { e.preventDefault(); wrapSel('*'); }
});

/* ── 목차 현재 위치 + 스크롤 기억 + 맨 위로 ── */
function spy() {
  if (!heads.length) return;
  const top = scroller.getBoundingClientRect().top + 90;
  let c = heads[0];
  for (const h of heads) { if (h[0].getBoundingClientRect().top <= top) c = h; else break; }
  heads.forEach(h => h[1].classList.toggle('on', h === c));
  const r = c[1].getBoundingClientRect(), tr = $('toc').getBoundingClientRect();
  if (r.top < tr.top || r.bottom > tr.bottom) c[1].scrollIntoView({ block: 'nearest' });
}
const updateTop = () => $('toTop').classList.toggle('show', (editing ? editor.scrollTop : scroller.scrollTop) > 400);
let saveT;
scroller.addEventListener('scroll', () => {
  requestAnimationFrame(spy); updateTop();
  clearTimeout(saveT); saveT = setTimeout(() => { if (active) { scrollPos[active] = scroller.scrollTop; ls.set('scroll', scrollPos); } }, 300);
});
editor.addEventListener('scroll', updateTop);
$('toTop').onclick = () => {
  if (editing) editor.scrollTo({ top: 0, behavior: 'smooth' });
  scroller.scrollTo({ top: 0, behavior: 'smooth' });
};
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  e.preventDefault();
  if (a.dataset.md) { api('push', { paths: [a.dataset.md] }).then(poll).catch(() => toast(t('cant_open'))); return; }
  const id = decodeURIComponent(a.getAttribute('href').slice(1));
  const el = document.getElementById(id) || document.getElementsByName(id)[0];
  if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
});

/* ── 버튼/단축키 ── */
const pick = $('pick');
pick.onchange = () => { addFiles([...pick.files]); pick.value = ''; };
$('openBtn').onclick = $('emptyOpen').onclick = openFiles;
$('newBtn').onclick = $('emptyNew').onclick = newDoc;
$('editBtn').onclick = () => setEditing(!editing);
$('aboutBtn').onclick = () => {
  $('about').classList.add('show'); $('notices').textContent = t('loading');
  fetch('notices.txt').then(r => r.text()).then(t => $('notices').textContent = t).catch(() => {});
};
$('aboutClose').onclick = () => $('about').classList.remove('show');
$('about').onclick = e => { if (e.target.id === 'about') $('about').classList.remove('show'); };
addEventListener('keydown', e => { if (e.key === 'Escape') $('about').classList.remove('show'); });
$('saveBtn').onclick = () => save(false);
$('filter').oninput = renderList;
$('sideBtn').onclick = () => { prefs.side = !prefs.side; savePrefs(); applyPrefs(); };
$('fsDown').onclick = () => { prefs.fs = Math.max(14, prefs.fs - 1); savePrefs(); applyPrefs(); toast(t('fs_toast', prefs.fs)); };
$('fsUp').onclick = () => { prefs.fs = Math.min(24, prefs.fs + 1); savePrefs(); applyPrefs(); toast(t('fs_toast', prefs.fs)); };
$('wideBtn').onclick = () => { prefs.wide = !prefs.wide; savePrefs(); applyPrefs(); };
$('themeBtn').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const c = prefs.theme || (dark ? 'dark' : 'light');
  prefs.theme = c === 'dark' ? 'light' : 'dark'; savePrefs(); applyPrefs();
};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.ctrlKey && k === 's') { e.preventDefault(); save(e.shiftKey); return; }
  if (e.ctrlKey && k === 'o') { e.preventDefault(); openFiles(); return; }
  if (e.ctrlKey && k === 'e') { e.preventDefault(); setEditing(!editing); return; }
  if (e.ctrlKey || e.altKey || e.metaKey || /input|textarea/i.test(e.target.tagName)) return;
  if (k === 't') $('sideBtn').click();
  if (k === 'd') $('themeBtn').click();
});

/* ── 드래그 앤 드롭 (여러 개) ── */
let depth = 0;
addEventListener('dragenter', e => { e.preventDefault(); depth++; body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); depth = 0; body.classList.remove('dragging');
  addFiles([...e.dataTransfer.files]);
});

/* ── 시작 ── */
LANG = pickLang(prefs.lang || SYS_LANG);
$('langSel').innerHTML = Object.keys(I18N).map(c => `<option value="${c}">${I18N[c]._name}</option>`).join('');
$('langSel').value = LANG;
$('langSel').onchange = () => { prefs.lang = LANG = $('langSel').value; savePrefs(); applyI18n(); setEditing(editing); refresh(); };
applyI18n(); setEditing(false);
applyPrefs();
DB.all().then(all => {
  const saved = ls.get('docs', []);
  docs = ((all && all.length) ? all : saved).sort((a, b) => a.added - b.added);
  refresh();
  poll(); setInterval(poll, 700); setInterval(watch, 2000);
});
</script>
</body>
